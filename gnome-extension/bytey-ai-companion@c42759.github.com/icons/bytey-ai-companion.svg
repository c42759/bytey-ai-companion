<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <clipPath id="pill-outer-clip">
      <rect x="8" y="25" width="112" height="74" rx="37" ry="37"/>
    </clipPath>
    <clipPath id="pill-inner-clip">
      <rect x="13.5" y="30.5" width="101" height="63" rx="31.5" ry="31.5"/>
    </clipPath>
    <linearGradient id="bevel-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2E3B"/>
      <stop offset="100%" stop-color="#090A0F"/>
    </linearGradient>
    <linearGradient id="rainbow-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <radialGradient id="pool-cyan" cx="16" cy="62" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="48%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool-indigo" cx="44" cy="24" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="1"/>
      <stop offset="48%" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool-magenta" cx="86" cy="24" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="1"/>
      <stop offset="48%" stop-color="#F43F5E" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool-orange" cx="114" cy="62" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="1"/>
      <stop offset="48%" stop-color="#F59E0B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool-yellow" cx="86" cy="100" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="1"/>
      <stop offset="48%" stop-color="#84CC16" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#84CC16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool-emerald" cx="42" cy="100" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="1"/>
      <stop offset="48%" stop-color="#14B8A6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim-highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="obsidian-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151720"/>
      <stop offset="35%" stop-color="#0A0B0F"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="glass-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="eye-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5F0FF"/>
    </linearGradient>
  </defs>

  <!-- Subtle ground shadow -->
  <ellipse cx="64" cy="106.5" rx="44" ry="4" fill="#000000" opacity="0.22"/>

  <!-- GNOME HIG 3D bottom extrusion bevel -->
  <rect x="8" y="29" width="112" height="74" rx="37" ry="37" fill="url(#bevel-grad)"/>

  <!-- 360-degree rainbow gradient rim (pure SVG 1.1 radial color mesh clipped to outer pill) -->
  <g clip-path="url(#pill-outer-clip)">
    <rect x="8" y="25" width="112" height="74" fill="url(#rainbow-base)"/>
    <rect x="8" y="25" width="112" height="74" fill="url(#pool-indigo)"/>
    <rect x="8" y="25" width="112" height="74" fill="url(#pool-magenta)"/>
    <rect x="8" y="25" width="112" height="74" fill="url(#pool-orange)"/>
    <rect x="8" y="25" width="112" height="74" fill="url(#pool-yellow)"/>
    <rect x="8" y="25" width="112" height="74" fill="url(#pool-emerald)"/>
    <rect x="8" y="25" width="112" height="74" fill="url(#pool-cyan)"/>
  </g>

  <!-- Subtle top specular rim stroke -->
  <rect x="8.6" y="25.6" width="110.8" height="72.8" rx="36.4" ry="36.4"
        fill="none" stroke="url(#rim-highlight)" stroke-width="1.2"/>

  <!-- Matte-obsidian Dynamic Island interior -->
  <rect x="13.5" y="30.5" width="101" height="63" rx="31.5" ry="31.5" fill="url(#obsidian-face)"/>

  <!-- Subtle top glass sheen inside interior -->
  <g clip-path="url(#pill-inner-clip)">
    <ellipse cx="64" cy="30" rx="52" ry="18" fill="url(#glass-sheen)"/>
  </g>

  <!-- Crisp inner edge separator -->
  <rect x="13.8" y="30.8" width="100.4" height="62.4" rx="31.2" ry="31.2"
        fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="1"/>

  <!-- Soft eye ambient glow -->
  <rect x="39" y="49" width="18" height="26" rx="9" ry="9" fill="#BAE6FD" opacity="0.16"/>
  <rect x="71" y="49" width="18" height="26" rx="9" ry="9" fill="#BAE6FD" opacity="0.16"/>

  <!-- Expressive Grok-style Bytey eyes -->
  <rect x="40.5" y="50.5" width="15" height="23" rx="7.5" ry="7.5" fill="url(#eye-fill)"/>
  <rect x="72.5" y="50.5" width="15" height="23" rx="7.5" ry="7.5" fill="url(#eye-fill)"/>
</svg>
