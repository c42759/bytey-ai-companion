[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bytey-ai-companion-daemon"
version = "0.1.0"
description = "Portable Python asyncio core daemon for the Bytey AI Companion Dynamic Island assistant"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "websockets>=14.0",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0",
    "silero-vad>=5.1",
    "rapidfuzz>=3.0",
    "sounddevice>=0.4",
    "piper-tts>=1.2",
]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
bytey-ai-companion-daemon = "bytey_ai_companion.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bytey_ai_companion*"]

[tool.setuptools.package-data]
bytey_ai_companion = ["llm/*.md", "skills/builtin/**/*"]
